# Имя проекта compose — обязательно задано явно.
#
# Без него compose берёт имя из basename каталога с compose-файлом. У этого
# проекта каталог `site/`, и у проекта downloads каталог ТОЖЕ `site/`, поэтому
# оба проект назывались `site`. Из-за этого docker compose считал контейнер
# downloads-web «сиротой»:
#
#   WARN[0000] Found orphan containers (downloads-web) for this project.
#
# Сама по себе надпись безобидна, но опасна в действии: `docker compose down
# --remove-orphans` (или `up -d --remove-orphans`) в ~/nuget/site снёс бы
# контейнер downloads-web — то есть уронил боевой downloads.quantumart.ru.
name: nuget

services:
  baget:
    image: loicsharma/baget:latest
    container_name: nuget-baget
    restart: unless-stopped
    # 127.0.0.1 — как у остальных сайтов на этом VPS: наружу торчит только
    # хостовый nginx (TLS + reverse proxy), контейнер слушает только локально.
    # Порт 3022 — соседний с downloads (3021) и sidus (3020). Занятые на момент
    # настройки: 3001, 3010, 3020, 3021, 5000, 7700, 8090, 9117.
    # Проверь `docker ps` перед первым запуском на случай, если что-то изменилось.
    ports:
      - "127.0.0.1:3022:80"
    environment:
      # ── Ключ публикации ──────────────────────────────────────────────────
      # Пустое значение (по умолчанию) = пуш открыт для всех. Для боевого
      # домена это дыра: кто угодно может залить пакет.
      #
      # Задаётся через .env рядом с этим файлом:
      #     echo "BAGET_APIKEY=$(openssl rand -hex 24)" > .env
      #     chmod 600 .env
      # и пересоздаётся контейнером:
      #     docker compose up -d
      #
      # Ключ влияет ТОЛЬКО на публикацию (PUT /api/v2/package). Чтение —
      # restore и скачивание — остаётся открытым, поэтому клиенты ничего
      # не почувствуют. Проверено: без ключа 401, с неверным 401, с верным 201.
      - "ApiKey=${BAGET_APIKEY:-}"

      # ВНИМАНИЕ, две грабли, обе проверены на практике:
      #
      # 1. Ключ конфига — Storage:Path, а НЕ FileStorage:Path. Официальный
      #    Docker-гайд BaGet предлагает FileStorage__Path, но эта версия движка
      #    читает путь из секции Storage. С FileStorage__Path переменная молча
      #    игнорируется, пакеты пишутся в /app/packages — внутрь слоя
      #    контейнера. Фид при этом РАБОТАЕТ, ошибки не видно, и всё теряется
      #    при первом же `docker rm`. С Storage:Path пишет в подключённый том.
      #
      # 2. SQLite-база тоже обязана быть в томе. По умолчанию
      #    Data Source=baget.db — рядом с бинарём, то есть опять в слое
      #    контейнера. Без явного пути индекс и метаданные не переживут
      #    пересоздание контейнера.
      #
      # BaGet сам дописывает "packages" к Storage:Path, поэтому фактический
      # путь внутри тома — /var/baget/packages/packages/<id>/<version>/.
      # Это нормально, данные на месте; не ищи по /var/baget/packages/<id>.
      - "Storage:Type=FileSystem"
      - "Storage:Path=/var/baget/packages"
      - "Database:Type=Sqlite"
      - "Database:ConnectionString=Data Source=/var/baget/baget.db"
    volumes:
      - "../baget-data:/var/baget"
    healthcheck:
      # curl, а НЕ wget: в образе BaGet (dotnet aspnet, Debian-база) wget
      # отсутствует, есть только /usr/bin/curl. Healthcheck на wget падал бы
      # всегда и метил контейнер как unhealthy при полностью рабочем фиде —
      # ровно то, что случилось на VPS.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1/v3/index.json || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
